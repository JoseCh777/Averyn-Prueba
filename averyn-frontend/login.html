<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acceso a la plataforma Averyn." />
    <title>Averyn — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="assets/css/design-system.css" rel="stylesheet" />
    <link href="assets/css/login.css" rel="stylesheet" />
  </head>
  <body>
    <main class="av-login-page d-flex align-items-center py-3 py-lg-4" aria-label="Página de inicio de sesión">
      <div class="container">
        <div class="av-auth" id="auth-card">

          <!-- Panel oscuro -->
          <aside class="av-auth-side" aria-label="Información de Averyn">
            <div>
              <div class="av-auth-logo mb-4"><img src="assets/images/averyn-logo-lockup-white.avif" alt="Averyn" /></div>
              <div class="av-auth-copy">
                <h1 class="display-5 fw-bold mb-3">Todo listo para continuar.</h1>
                <p class="av-auth-side-text mb-0">Accede al espacio donde tu operación electoral toma forma, con información clara y control en cada paso.</p>
              </div>
            </div>
            
            <a class="btn btn-link text-decoration-none p-0 av-auth-back small mb-4" href="index.html"><i class="bi bi-arrow-left me-1"></i> Volver al inicio</a>
            <div class="av-auth-side-foot">
              
              <small class="text-white-50">Averyn · Gestión electoral segura</small>
            </div>
          </aside>

          <!-- Panel blanco -->
          <section class="av-auth-panel" aria-labelledby="login-title">
            <div class="mb-4"><img class="av-logo av-logo-login" src="assets/images/averyn-logo-lockup-black.avif" alt="Averyn" /></div>

            <div class="av-auth-form">
              <div class="mb-4">
                <h2 id="login-title" class="display-6 fw-bold mb-2">Bienvenido de nuevo.</h2>
                <p class="av-muted mb-0">Ingresa tus credenciales para continuar.</p>
              </div>
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input id="email" name="email" type="email" class="form-control av-login-input" placeholder="nombre@organizacion.com" autocomplete="email" />
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label">Contraseña</label>
                    <button type="button" id="forgot-link" class="btn btn-link p-0 small text-decoration-none">¿Olvidaste tu contraseña?</button>
                  </div>
                  <div class="input-group">
                    <input id="password" name="password" type="password" class="form-control av-login-input border-end-0" placeholder="Ingresa tu contraseña" autocomplete="current-password" aria-describedby="password-help" />
                    <button class="btn border border-start-0 av-login-input" type="button" id="toggle-password" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                  </div>
                  <small id="password-help" class="av-input-help" aria-live="polite"></small>
                </div>
                <div id="alert-error" class="av-alert av-alert--error py-2 small mb-0" role="alert" hidden><i class="bi bi-exclamation-circle me-1"></i><span></span></div>
                <div id="alert-success" class="av-alert av-alert--success py-2 small mb-0" role="status" hidden><i class="bi bi-check-circle me-1"></i><span></span></div>
                <div id="alert-info" class="av-alert av-alert--info py-2 small mb-0" role="status" hidden><i class="bi bi-info-circle me-1"></i><span></span></div>
                <button type="submit" id="submit-btn" class="btn av-btn-primary w-100 mt-3">
                  <span id="submit-idle"><i class="bi bi-lock me-2"></i>Ingresar de forma segura</span>
                  <span id="submit-loading" hidden><span class="spinner-border spinner-border-sm me-2"></span>Verificando...</span>
                </button>
              </form>
              <div class="d-flex align-items-center gap-2 justify-content-center mt-4 small av-muted"><i class="bi bi-shield-check text-success"></i>Conexión segura y protegida</div>
            </div>

          </section>

        </div>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
